<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Leader: Vietnam</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --jungle-dark: #1a2b1a;
            --jungle-mid: #2d4a2d;
            --earth-brown: #5c4a3a;
            --dust-tan: #d4c4a8;
            --blood-red: #8b2e2e;
            --radio-green: #4a7c59;
            --smoke-gray: #9a9a8a;
            --warning-yellow: #e8d174;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background: linear-gradient(135deg, var(--jungle-dark) 0%, var(--earth-brown) 100%);
            color: var(--dust-tan);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
        }

        #root {
            position: relative;
            z-index: 2;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid var(--earth-brown);
            border-left: 8px solid var(--blood-red);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header::before {
            content: '★ ★ ★';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--warning-yellow);
            font-size: 12px;
            letter-spacing: 8px;
        }

        .title {
            font-family: 'Saira Condensed', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--warning-yellow);
            text-shadow: 3px 3px 0 var(--blood-red), 6px 6px 20px rgba(0, 0, 0, 0.7);
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: var(--smoke-gray);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .faction-select {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .faction-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid var(--earth-brown);
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .faction-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .faction-card:hover::before {
            left: 100%;
        }

        .faction-card:hover {
            transform: translateY(-5px);
            border-color: var(--warning-yellow);
            box-shadow: 0 10px 30px rgba(232, 209, 116, 0.3);
        }

        .faction-card.us {
            border-left: 8px solid #3c5a99;
        }

        .faction-card.nva {
            border-left: 8px solid #da251d;
        }

        .faction-title {
            font-family: 'Saira Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: var(--warning-yellow);
        }

        .faction-description {
            font-size: 13px;
            line-height: 1.6;
            color: var(--dust-tan);
        }

        .story-container {
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid var(--earth-brown);
            border-left: 8px solid var(--radio-green);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out both;
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--earth-brown);
        }

        .location {
            font-family: 'Saira Condensed', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--warning-yellow);
            letter-spacing: 2px;
        }

        .squad-status {
            font-size: 12px;
            color: var(--radio-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .narrative {
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 25px;
            color: var(--dust-tan);
            animation: typeIn 0.8s ease-out 0.2s both;
        }

        @keyframes typeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-button {
            background: linear-gradient(135deg, var(--jungle-mid) 0%, var(--earth-brown) 100%);
            border: 2px solid var(--earth-brown);
            padding: 18px 25px;
            color: var(--dust-tan);
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .choice-button::before {
            content: '▸';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--warning-yellow);
            transition: left 0.3s;
        }

        .choice-button:hover::before {
            left: 10px;
        }

        .choice-button:hover {
            background: linear-gradient(135deg, var(--radio-green) 0%, var(--jungle-mid) 100%);
            border-color: var(--warning-yellow);
            transform: translateX(10px);
            padding-left: 40px;
        }

        .choice-button:active {
            transform: translateX(10px) scale(0.98);
        }

        .squad-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--earth-brown);
        }

        .stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 15px;
            border-left: 3px solid var(--radio-green);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--smoke-gray);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--warning-yellow);
        }

        .reset-button {
            background: var(--blood-red);
            border: 2px solid var(--earth-brown);
            color: var(--dust-tan);
            font-family: 'Saira Condensed', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 30px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .donate-section {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--earth-brown);
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .donate-text {
            font-size: 12px;
            color: var(--dust-tan);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .donate-button {
            background: var(--radio-green);
            border: 2px solid var(--earth-brown);
            color: var(--dust-tan);
            font-family: 'Saira Condensed', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px 25px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            width: 100%;
        }

        .donate-button:hover {
            background: var(--warning-yellow);
            color: var(--jungle-dark);
            transform: scale(1.05);
        }

        .reset-button:hover {
            background: var(--warning-yellow);
            color: var(--jungle-dark);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .faction-select {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 2.5rem;
            }

            .story-container {
                padding: 20px;
            }
        }
    </style>
</head>

        function SquadLeaderGame() {
            const [faction, setFaction] = useState(null);
            const [currentScene, setCurrentScene] = useState('start');

            const handleFactionSelect = (selectedFaction) => {
                setFaction(selectedFaction);
            };

            const handleChoice = (nextScene) => {
                setCurrentScene(nextScene);
            };

            const resetGame = () => {
                setFaction(null);
                setCurrentScene('start');
            };

            if (!faction) {
                return (
                    <div className="game-container">
                        <div className="header">
                            <h1 className="title">Squad Leader</h1>
                            <p className="subtitle">Vietnam 1968</p>
                        </div>
                        
                        <div className="faction-select">
                            <div className="faction-card us" onClick={() => handleFactionSelect('us')}>
                                <h2 className="faction-title">U.S. Army</h2>
                                <p className="faction-description">
                                    Lead an American rifle squad in the Central Highlands. Superior firepower and air support, but fighting in unfamiliar terrain against an elusive enemy. Technology versus determination.
                                </p>
                            </div>
                            
                            <div className="faction-card nva" onClick={() => handleFactionSelect('nva')}>
                                <h2 className="faction-title">NVA / VC</h2>
                                <p className="faction-description">
                                    Command a People's Army squad on the Ho Chi Minh Trail. Outnumbered and outgunned, but you know this land. Patience, discipline, and cunning against overwhelming force.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            const scene = gameData[faction][currentScene];
            const isEnding = scene.choices.length === 0;

            return (
                <div className="game-container">
                    <div className="header">
                        <h1 className="title">Squad Leader</h1>
                        <p className="subtitle">{faction === 'us' ? 'U.S. Army' : 'NVA / Viet Cong'}</p>
                    </div>

                    <div className="story-container">
                        <div className="location-header">
                            <div className="location">{scene.location}</div>
                            <div className="squad-status">● ACTIVE</div>
                        </div>

                        <p className="narrative">{scene.narrative}</p>

                        {!isEnding ? (
                            <div className="choices">
                                {scene.choices.map((choice, index) => (
                                    <button
                                        key={index}
                                        className="choice-button"
                                        onClick={() => handleChoice(choice.next)}
                                    >
                                        {choice.text}
                                    </button>
                                ))}
                            </div>
                        ) : (
                            <div>
                                <div className="donate-section">
                                    <p className="donate-text">
                                        Enjoyed your journey? Support the developer with a coffee!
                                    </p>
                                    <button 
                                        className="donate-button"
                                        onClick={() => window.open('https://www.buymeacoffee.com/a1mega', '_blank')}
                                    >
                                        ☕ Buy Me A Coffee
                                    </button>
                                </div>
                                <div className="choices">
                                    <button className="reset-button" onClick={resetGame}>
                                        ★ New Mission ★
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="squad-info">
                            <div className="stat">
                                <div className="stat-label">Squad Size</div>
                                <div className="stat-value">{scene.squadSize} Men</div>
                            </div>
                            <div className="stat">
                                <div className="stat-label">Morale</div>
                                <div className="stat-value">{scene.morale}</div>
                            </div>
                            <div className="stat">
                                <div className="stat-label">Supplies</div>
                                <div className="stat-value">{scene.supplies}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<SquadLeaderGame />, document.getElementById('root'));
    </script>
